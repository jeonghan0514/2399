<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 設定固定寬度為 1200px，讓手機開啟時整體自動等比例縮放適合螢幕 -->
  <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes">
  
  <!-- 網頁與社群分享標題 -->
  <title>정한X조슈아｜JxJ COMEBACK SCHEDULE</title>
  <meta property="og:title" content="정한X조슈아｜JxJ COMEBACK SCHEDULE">
  <meta property="og:description" content="좋아하는 사람은 하염없이 기다리는 거야 💎">
  <meta property="og:image" content="./banner.jpg">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#F4F8F4',
              100: '#E5EFE5',
              200: '#C5DCC6',
              300: '#A3C9A8',
              400: '#81B287',
              500: '#6E9975',
              600: '#5C8363',
              700: '#47674D',
              800: '#37503C',
            },
            // 柔和紅 (用於假日日期與星期文字)
            softred: {
              500: '#E06D53',
              600: '#D96B6B',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-6 min-h-screen">
  <div id="app" class="w-[1150px] mx-auto space-y-6">
    
    <!-- 頁首區塊 -->
    <header class="bg-white rounded-2xl overflow-hidden shadow-sm border border-sage-200">
      <div class="w-full h-48 bg-cover bg-center" style="background-image: url('./banner.jpg');"></div>
      <div class="p-5 flex justify-between items-center gap-4 border-t border-sage-100">
        <div class="flex items-center space-x-3.5">
          <img src="./logo.jpg" alt="Logo" class="w-12 h-12 rounded-xl shadow-sm border border-sage-200 object-cover">
          <div>
            <h1 class="text-2xl font-bold tracking-wide text-sage-800">정한X조슈아｜JxJ COMEBACK SCHEDULE</h1>
            <p class="text-slate-500 mt-0.5 text-sm font-medium">좋아하는 사람은 하염없이 기다리는 거야 💎</p>
          </div>
        </div>
      </div>
    </header>

    <!-- 回歸時間軸流水帳 -->
    <main class="space-y-4">

      <!-- 流水帳清單卡片 -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden divide-y divide-slate-100">
        
        <div v-if="groupedEvents.length === 0" class="p-12 text-center text-slate-400 text-sm">
          目前還沒有動態紀錄。
        </div>

        <!-- 依日期分組顯示 -->
        <template v-for="(group, gIdx) in groupedEvents" :key="group.dateKey">
          
          <!-- 月份分隔橫條 -->
          <div v-if="group.showMonthHeader" class="bg-sage-100/70 border-y border-sage-200/80 px-5 py-2.5 flex items-center justify-between">
            <span class="text-xs font-bold text-sage-800 tracking-wider flex items-center gap-1.5">
              <span>📅</span> {{ group.monthTitle }}
            </span>
            <span class="text-[11px] font-semibold text-sage-600 bg-white/70 px-2 py-0.5 rounded-full border border-sage-200">
              {{ group.monthEventCount }} 個行程動態
            </span>
          </div>

          <!-- 當日區塊 -->
          <div :class="gIdx % 2 === 0 ? 'bg-white' : 'bg-sage-50/50'" class="flex flex-row transition">
            
            <!-- 左側日期欄 -->
            <div class="w-28 p-4 border-r border-slate-100/80 flex flex-col items-center justify-center text-center shrink-0">
              <div class="flex flex-col items-center justify-center gap-0.5">
                <span class="text-2xl font-bold tracking-tight leading-none" :class="group.isHoliday ? 'text-softred-600' : 'text-slate-700'">{{ group.dayNum }}</span>
                <span class="text-[11px] font-bold uppercase tracking-wide" :class="group.isHoliday ? 'text-softred-500' : 'text-sage-600'">{{ group.weekDay }}</span>
              </div>
            </div>

            <!-- 右側當天時間列表 (小時之間用清晰實線 divide-slate-200) -->
            <div class="flex-1 divide-y divide-slate-200 p-3 space-y-2">
              <div v-for="timeBlock in group.timeBlocks" :key="timeBlock.timeStr" class="flex items-center space-x-4 p-1.5 rounded-lg hover:bg-sage-100/30 transition pt-2 first:pt-0">
                
                <!-- 小時置中標籤 (垂直置中對齊) -->
                <div class="w-12 shrink-0 text-left self-center">
                  <span class="text-sm font-mono font-bold text-slate-400 block">{{ timeBlock.timeStr }}</span>
                </div>

                <!-- 同一個小時內的多個行程項目 (行程間用 sage-400 鼠尾草綠虛線) -->
                <div class="flex-1 space-y-2 divide-y divide-dashed divide-sage-400/80">
                  <div v-for="item in timeBlock.items" :key="item.id" class="flex items-center justify-between pt-2 first:pt-0">
                    
                    <div class="flex items-center space-x-3 overflow-hidden">
                      <!-- 圓形 Logo 圖片標籤 -->
                      <div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-200 shadow-2xs" :title="item.platform">
                        <img :src="getPlatformIcon(item.platform)" :alt="item.platform" class="w-full h-full object-cover">
                      </div>

                      <!-- 動態標題 -->
                      <a v-if="item.link" :href="item.link" target="_blank" rel="noopener noreferrer" 
                         class="text-sm font-medium text-slate-800 hover:text-sage-700 hover:underline flex items-center gap-1.5 truncate"
                         title="點擊開啟外連網址">
                        <span>{{ item.title }}</span>
                        <span class="text-[10px] bg-sage-100 text-sage-700 px-1.5 py-0.5 rounded-full font-bold">🔗 開啟</span>
                      </a>
                      <span v-else class="text-sm font-medium text-slate-700 truncate">
                        {{ item.title }}
                      </span>
                    </div>

                  </div>
                </div>

              </div>
            </div>

          </div>

        </template>

      </div>

    </main>

  </div>

  <!-- Realtime Database 模組載入與 Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBSYT-iNksOHfbdG2BRlwJD8YRNmJ7tFys",
      authDomain: "jxjschedule.firebaseapp.com",
      databaseURL: "https://jxjschedule-default-rtdb.firebaseio.com",
      projectId: "jxjschedule",
      storageBucket: "jxjschedule.firebasestorage.app",
      messagingSenderId: "407766532126",
      appId: "1:407766532126:web:45742371eb7c1f00896e0f",
      measurementId: "G-XCCCGNBHZ3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const events = ref([]);

        // 台灣國定假日對照表
        const holidaysMap = {
          '2026-01-01': true,
          '2026-02-15': true, '2026-02-16': true, '2026-02-17': true, '2026-02-18': true, '2026-02-19': true, '2026-02-20': true,
          '2026-02-27': true, '2026-02-28': true,
          '2026-04-03': true, '2026-04-04': true, '2026-04-05': true, '2026-04-06': true,
          '2026-05-01': true,
          '2026-06-19': true,
          '2026-09-25': true,
          '2026-09-28': true,
          '2026-10-09': true, '2026-10-10': true,
          '2026-10-25': true, '2026-10-26': true,
          '2026-12-25': true
        };

        const platformOptions = [
          { name: 'Instagram', icon: './IG.jpg' },
          { name: 'X', icon: './X.jpg' },
          { name: 'Weverse', icon: './WVS.jpg' },
          { name: 'Youtube', icon: './YT.png' },
          { name: 'Seventeen', icon: './logo.jpg' }
        ];

        onMounted(() => {
          onValue(dbRef(db, 'events'), (snapshot) => {
            const data = snapshot.val();
            events.value = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
          });
        });

        const getPlatformIcon = (platformName) => {
          const found = platformOptions.find(p => p.name === platformName);
          return found ? found.icon : './logo.jpg';
        };

        const groupedEvents = computed(() => {
          const dateGroups = {};
          const sorted = [...events.value].sort((a, b) => new Date(a.date) - new Date(b.date));

          sorted.forEach(item => {
            if (!item.date) return;
            const d = new Date(item.date);
            const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
            const monthTitle = `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
            const dayNum = String(d.getDate()).padStart(2, '0');
            const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayOfWeek = d.getDay();
            const weekDay = weekDays[dayOfWeek];
            
            // 以「小時」為分組單位 (例如 18:00)
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:00`;

            const isHoliday = (dayOfWeek === 0 || dayOfWeek === 6) || Boolean(holidaysMap[dateKey]);

            if (!dateGroups[dateKey]) {
              dateGroups[dateKey] = { dateKey, monthKey, monthTitle, dayNum, weekDay, isHoliday, timeMap: {}, totalCount: 0 };
            }

            if (!dateGroups[dateKey].timeMap[timeStr]) {
              dateGroups[dateKey].timeMap[timeStr] = [];
            }

            dateGroups[dateKey].timeMap[timeStr].push(item);
            dateGroups[dateKey].totalCount++;
          });

          let lastMonthKey = '';
          const result = [];

          Object.values(dateGroups).forEach(group => {
            const showMonthHeader = group.monthKey !== lastMonthKey;
            if (showMonthHeader) {
              lastMonthKey = group.monthKey;
            }

            const monthEventCount = sorted.filter(e => {
              const ed = new Date(e.date);
              return `${ed.getFullYear()}-${String(ed.getMonth()+1).padStart(2, '0')}` === group.monthKey;
            }).length;

            const timeBlocks = Object.keys(group.timeMap).map(timeStr => ({
              timeStr,
              items: group.timeMap[timeStr]
            }));

            result.push({
              dateKey: group.dateKey,
              monthTitle: group.monthTitle,
              showMonthHeader,
              monthEventCount,
              dayNum: group.dayNum,
              weekDay: group.weekDay,
              isHoliday: group.isHoliday,
              timeBlocks
            });
          });

          return result;
        });

        return {
          events, groupedEvents,
          platformOptions, getPlatformIcon
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
