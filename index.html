<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes">
  <title>정한X조슈아｜JxJ COMEBACK SCHEDULE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              50: '#F4F8F4',
              100: '#E5EFE5',
              200: '#C5DCC6',
              300: '#A3C9A8',
              500: '#6E9975',
              600: '#5C8363',
              700: '#47674D',
              800: '#37503C',
            },
            // 新增柔和紅系列色調
            softred: {
              50: '#FFF5F5',
              100: '#FCE8E6',
              500: '#E06D53',
              600: '#D96B6B',
              700: '#C15252',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 p-6 min-h-screen">
  <div id="app" class="w-[1150px] mx-auto space-y-6">
    
    <!-- 頁首區塊 -->
    <header class="bg-white rounded-2xl overflow-hidden shadow-sm border border-sage-200">
      <div class="w-full h-48 bg-cover bg-center" style="background-image: url('./banner.jpg');"></div>
      <div class="p-5 flex justify-between items-center gap-4 border-t border-sage-100">
        <div class="flex items-center space-x-3.5">
          <img src="./logo.jpg" alt="Logo" class="w-12 h-12 rounded-xl shadow-sm border border-sage-200 object-cover">
          <div>
            <h1 class="text-2xl font-bold tracking-wide text-sage-800">정한X조슈아｜JxJ COMEBACK SCHEDULE</h1>
            <p class="text-slate-500 mt-0.5 text-sm font-medium">좋아하는 사람은 하염없이 기다리는 거야 💎</p>
          </div>
        </div>

        <nav class="flex bg-sage-50 p-1 rounded-xl border border-sage-200">
          <button @click="currentTab = 'timeline'" :class="currentTab === 'timeline' ? 'bg-sage-600 text-white font-bold shadow-sm' : 'text-sage-700 hover:bg-sage-100'" class="px-5 py-2 rounded-lg text-sm transition">📋 回歸流水帳 (Timeline)</button>
          <button @click="currentTab = 'merch'" :class="currentTab === 'merch' ? 'bg-sage-600 text-white font-bold shadow-sm' : 'text-sage-700 hover:bg-sage-100'" class="px-5 py-2 rounded-lg text-sm transition">🛒 周邊購物</button>
        </nav>
      </div>
    </header>

    <main v-if="currentTab === 'timeline'" class="space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-sage-200 shadow-sm">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sage-600"></span>
          <h2 class="text-lg font-bold text-slate-700">정한X조슈아｜JxJ SCHEDULE</h2>
        </div>
        <button @click="showAddEvent = !showAddEvent" class="px-4 py-2 bg-sage-600 text-white rounded-lg text-sm font-medium hover:bg-sage-700 transition">
          {{ showAddEvent ? '取消' : '+ 新增行程/動態' }}
        </button>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden divide-y divide-slate-100">
        <template v-for="(group, gIdx) in groupedEvents" :key="group.dateKey">
          
          <div v-if="group.showMonthHeader" class="bg-sage-100/70 border-y border-sage-200/80 px-5 py-2.5 flex items-center justify-between">
            <span class="text-xs font-bold text-sage-800 tracking-wider flex items-center gap-1.5">
              <span>📅</span> {{ group.monthTitle }}
            </span>
            <span class="text-[11px] font-semibold text-sage-600 bg-white/70 px-2 py-0.5 rounded-full border border-sage-200">
              {{ group.monthEventCount }} 個行程動態
            </span>
          </div>

          <!-- 當日區塊：若是放假/國定假日/假日，套用 softred 柔和紅色系 -->
          <div :class="group.isHoliday ? 'bg-softred-50/60' : (gIdx % 2 === 0 ? 'bg-white' : 'bg-sage-50/50')" class="flex flex-row transition">
            
            <!-- 左側日期欄：如果是放假日，日期與星期轉為柔和紅字體 -->
            <div class="w-28 p-4 border-r border-slate-100/80 flex flex-col items-center justify-center text-center shrink-0"
                 :class="group.isHoliday ? 'bg-softred-100/40' : ''">
              <div class="flex flex-col items-center justify-center gap-0.5">
                <span class="text-2xl font-bold tracking-tight leading-none" :class="group.isHoliday ? 'text-softred-600' : 'text-slate-700'">{{ group.dayNum }}</span>
                <span class="text-[11px] font-bold uppercase tracking-wide" :class="group.isHoliday ? 'text-softred-500' : 'text-sage-600'">{{ group.weekDay }}</span>
                <span v-if="group.holidayName" class="text-[10px] font-bold text-softred-500 bg-white/80 px-1.5 py-0.5 rounded-full mt-1 border border-softred-100">{{ group.holidayName }}</span>
              </div>
            </div>

            <!-- 右側時間與內容區塊 -->
            <div class="flex-1 divide-y divide-slate-100/60 p-3 space-y-1">
              <div v-for="timeBlock in group.timeBlocks" :key="timeBlock.timeStr" class="flex items-center space-x-4 p-1.5 rounded-lg hover:bg-sage-100/40 transition">
                <div class="w-12 shrink-0 text-left self-center">
                  <span class="text-sm font-mono font-bold text-slate-400 block">{{ timeBlock.timeStr }}</span>
                </div>
                <div class="flex-1 space-y-1.5 divide-y divide-slate-50">
                  <div v-for="item in timeBlock.items" :key="item.id" class="flex items-center justify-between pt-1 first:pt-0 group">
                    <div class="flex items-center space-x-3 overflow-hidden">
                      <div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center shrink-0 border border-slate-200 shadow-2xs">
                        <img :src="getPlatformIcon(item.platform)" :alt="item.platform" class="w-full h-full object-cover">
                      </div>
                      <a v-if="item.link" :href="item.link" target="_blank" class="text-sm font-medium text-slate-800 hover:text-sage-700 hover:underline flex items-center gap-1.5 truncate">
                        <span>{{ item.title }}</span>
                        <span class="text-[10px] bg-sage-100 text-sage-700 px-1.5 py-0.5 rounded-full font-bold">🔗 開啟</span>
                      </a>
                      <span v-else class="text-sm font-medium text-slate-700 truncate">{{ item.title }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </template>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCcm-2NztU3Abk6MvnMwL-xr0aXVuyII3c",
      authDomain: "project-7363487371782368090.firebaseapp.com",
      databaseURL: "https://project-7363487371782368090-default-rtdb.firebaseio.com",
      projectId: "project-7363487371782368090",
      storageBucket: "project-7363487371782368090.firebasestorage.app",
      messagingSenderId: "237945111149",
      appId: "1:237945111149:web:fab708f30a372137c17564",
      measurementId: "G-LXNMT3SKBF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const currentTab = ref('timeline');
        const events = ref([]);

        // 台灣法定國定假日與補休日列表對照表
        const holidaysMap = {
          '2026-01-01': '元旦',
          '2026-02-15': '小年夜',
          '2026-02-16': '除夕',
          '2026-02-17': '初一',
          '2026-02-18': '初二',
          '2026-02-19': '初三',
          '2026-02-20': '補假',
          '2026-02-27': '228補假',
          '2026-02-28': '228和平紀念日',
          '2026-04-03': '兒童節補假',
          '2026-04-04': '兒童節',
          '2026-04-05': '清明節',
          '2026-04-06': '清明節補假',
          '2026-05-01': '勞動節',
          '2026-06-19': '端午節',
          '2026-09-25': '中秋節',
          '2026-09-28': '教師節',
          '2026-10-09': '國慶補假',
          '2026-10-10': '國慶日',
          '2026-10-25': '光復節',
          '2026-10-26': '光復節補假',
          '2026-12-25': '行憲紀念日'
        };

        const platformOptions = [
          { name: 'Instagram', icon: './IG.jpg' },
          { name: 'X', icon: './X.jpg' },
          { name: 'Weverse', icon: './WVS.jpg' },
          { name: 'Youtube', icon: './YT.png' },
          { name: 'Seventeen', icon: './logo.jpg' }
        ];

        onMounted(() => {
          onValue(dbRef(db, 'events'), (snapshot) => {
            const data = snapshot.val();
            events.value = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
          });
        });

        const getPlatformIcon = (platformName) => {
          const found = platformOptions.find(p => p.name === platformName);
          return found ? found.icon : './logo.jpg';
        };

        const groupedEvents = computed(() => {
          const dateGroups = {};
          const sorted = [...events.value].sort((a, b) => new Date(a.date) - new Date(b.date));

          sorted.forEach(item => {
            if (!item.date) return;
            const d = new Date(item.date);
            const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
            const monthTitle = `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
            const dayNum = String(d.getDate()).padStart(2, '0');
            const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayOfWeek = d.getDay();
            const weekDay = weekDays[dayOfWeek];
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:00`;

            // 自動判斷放假：週六(6)、週日(0) 或 在國定假日清單內
            const isNationalHoliday = holidaysMap[dateKey];
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            const isHoliday = isWeekend || Boolean(isNationalHoliday);

            if (!dateGroups[dateKey]) {
              dateGroups[dateKey] = { dateKey, monthKey, monthTitle, dayNum, weekDay, isHoliday, holidayName: isNationalHoliday || '', timeMap: {} };
            }

            if (!dateGroups[dateKey].timeMap[timeStr]) {
              dateGroups[dateKey].timeMap[timeStr] = [];
            }

            dateGroups[dateKey].timeMap[timeStr].push(item);
          });

          let lastMonthKey = '';
          const result = [];

          Object.values(dateGroups).forEach(group => {
            const showMonthHeader = group.monthKey !== lastMonthKey;
            if (showMonthHeader) lastMonthKey = group.monthKey;

            const timeBlocks = Object.keys(group.timeMap).map(timeStr => ({
              timeStr,
              items: group.timeMap[timeStr]
            }));

            result.push({
              ...group,
              showMonthHeader,
              timeBlocks
            });
          });

          return result;
        });

        return { currentTab, events, groupedEvents, platformOptions, getPlatformIcon };
      }
    }).mount('#app');
  </script>
</body>
</html>
